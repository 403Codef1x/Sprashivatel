services:
  sprashivatel:
    build: .
    container_name: sprashivatel
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/sprashivatel.db
      BACKUP_DIR: /data/backups
    volumes:
      - sprashivatel_data:/data   # база и суточные копии — переживают пересборку и обновление
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sprashivatel_data:
